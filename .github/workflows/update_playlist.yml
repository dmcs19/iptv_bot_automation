name: Update IPTV playlists

on:
    #schedule:
    #    - cron: "0 0 * * *"
    workflow_dispatch: # Optional manual trigger
      inputs:
            bot:
                description: "Select which bot to run"
                required: false
                type: choice
                default: "LuxIPTV"  # Default bot for scheduled runs
                options:
                    - LayerSeven
                    - LuxIPTV
                    - TereaTv
                    - IPTVDoor
                    - All

jobs:
    run-bot-process:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Remove preinstalled Chrome
              run: |
                sudo apt-get purge google-chrome-stable -y
                sudo rm -rf /opt/google/chrome
                sudo rm -rf ~/.config/google-chrome
                sudo rm -rf ~/.cache/google-chrome

            - name: Install Chrome and matching ChromeDriver (stable)
              run: |
                set -e

                # Clean any existing Chrome/driver
                sudo apt-get purge -y google-chrome-stable || true
                sudo rm -rf /opt/google/chrome ~/.config/google-chrome ~/.cache/google-chrome
                sudo rm -f /usr/local/bin/chromedriver || true

                # Base deps
                sudo apt-get update
                sudo apt-get install -y wget unzip curl jq

                # Install latest stable Chrome
                wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
                sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y

                echo "Installed Chrome:"
                google-chrome --version

                # Use Chrome-for-Testing 'last-known-good-versions-with-downloads' (stable)
                CFT_URL="https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"
                CFT_JSON=$(curl -s "$CFT_URL")

                # Pick STABLE channel, linux, chromedriver
                CFT_VALUES=$(echo "$CFT_JSON" \
                  | jq -r '.channels.Stable')
                CHROMEDRIVER_VERSION=$(echo "$CFT_VALUES" | jq -r '.version')
                CHROMEDRIVER_URL=$(echo "$CFT_VALUES" \
                  | jq -r '.downloads.chromedriver[] | select(.platform=="linux64") | .url')

                if [ -z "$CHROMEDRIVER_VERSION" ] || [ "$CHROMEDRIVER_VERSION" = "null" ]; then
                  echo "Could not resolve ChromeDriver version from Stable channel"
                  exit 1
                fi

                echo "Resolved ChromeDriver version: $CHROMEDRIVER_VERSION"
                echo "Download URL: $CHROMEDRIVER_URL"

                # Download and install ChromeDriver
                wget -q -O /tmp/chromedriver-linux64.zip "$CHROMEDRIVER_URL"
                unzip -q /tmp/chromedriver-linux64.zip -d /tmp/
                sudo mv /tmp/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
                sudo chmod +x /usr/local/bin/chromedriver

                # Cleanup
                rm -f google-chrome-stable_current_amd64.deb
                rm -rf /tmp/chromedriver-linux64 /tmp/chromedriver-linux64.zip

                echo "Installed ChromeDriver:"
                chromedriver --version


            - name: Run the automation with Xvfb
              run: |
                Xvfb :99 -screen 0 1920x1080x24 &
                export DISPLAY=:99
                python run_bots.py --bot "${{ github.event.inputs.bot}}"
              env:
                DISPLAY: :99
                BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
                CHAT_ID: ${{ secrets.CHAT_ID }}
                PAT: ${{ secrets.PAT }}
                MAILSAC_API: ${{ secrets.MAILSAC_API }}
                CAPTCHA_API: ${{ secrets.CAPTCHA_API }}
