name: Update IPTV playlists

on:
    #schedule:
    #    - cron: "0 0 * * *"
    workflow_dispatch: # Optional manual trigger
      inputs:
            bot:
                description: "Select which bot to run"
                required: false
                type: choice
                default: "LuxIPTV"  # Default bot for scheduled runs
                options:
                    - LayerSeven
                    - LuxIPTV
                    - TereaTv
                    - IPTVDoor
                    - All

jobs:
    run-bot-process:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Remove preinstalled Chrome
              run: |
                sudo apt-get purge google-chrome-stable -y || true
                sudo rm -rf /opt/google/chrome ~/.config/google-chrome ~/.cache/google-chrome
                sudo rm -f /usr/local/bin/chromedriver /usr/bin/chromedriver || true

            - name: Setup Chrome and ChromeDriver
              id: setup-chrome
              uses: browser-actions/setup-chrome@v2
              with:
                chrome-version: latest        # or e.g. "146" or "stable"
                install-chromedriver: true    # IMPORTANT
                install-dependencies: true    # good idea on ubuntu-latest

            - name: Debug versions
              run: |
                echo "Chrome path: ${{ steps.setup-chrome.outputs.chrome-path }}"
                ${{ steps.setup-chrome.outputs.chrome-path }} --version
                which chromedriver || echo "no chromedriver on PATH"
                chromedriver --version

            - name: Setup Chrome symlinks
              run: |
                CHROME_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
                CACHE_ID=$(basename "$(dirname "$CHROME_PATH")")
                
                # Create symlinks to standard locations
                sudo ln -sf "$CHROME_PATH/chrome" /usr/local/bin/chrome
                sudo ln -sf "/opt/hostedtoolcache/setup-chrome/chromedriver/$CACHE_ID/x64/chromedriver" /usr/local/bin/chromedriver
                
                echo "Chrome symlinks created:"
                ls -la /usr/local/bin/chrome /usr/local/bin/chromedriver
                /usr/local/bin/chrome --version
                /usr/local/bin/chromedriver --version

            - name: Run the automation with Xvfb
              run: |
                export DISPLAY=:99
                python run_bots.py --bot "${{ github.event.inputs.bot}}"
              env:
                DISPLAY: :99
                CHROME_BINARY: "${{ steps.setup-chrome.outputs.chrome-path }}/chrome"
                CHROMEDRIVER_PATH: "/opt/hostedtoolcache/setup-chrome/chromedriver${{ steps.setup-chrome.outputs.chrome-path #/setup-chrome/chrome }}/x64/chromedriver"
                BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
                CHAT_ID: ${{ secrets.CHAT_ID }}
                PAT: ${{ secrets.PAT }}
                MAILSAC_API: ${{ secrets.MAILSAC_API }}
                CAPTCHA_API: ${{ secrets.CAPTCHA_API }}
