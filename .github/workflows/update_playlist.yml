name: Update IPTV playlists

on:
    #schedule:
    #    - cron: "0 0 * * *"
    workflow_dispatch: # Optional manual trigger
      inputs:
            bot:
                description: "Select which bot to run"
                required: false
                type: choice
                default: "LuxIPTV"  # Default bot for scheduled runs
                options:
                    - LayerSeven
                    - LuxIPTV
                    - TereaTv
                    - IPTVDoor
                    - All

jobs:
    run-bot-process:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Install matching Chrome and ChromeDriver (Stable CFT)
              run: |
                set -e

                # 1. Remove any existing Chrome and chromedriver
                sudo apt-get purge -y google-chrome-stable || true
                sudo rm -rf /opt/google/chrome ~/.config/google-chrome ~/.cache/google-chrome
                sudo rm -f /usr/local/bin/chromedriver /usr/bin/chromedriver || true

                # 2. Dependencies
                sudo apt-get update
                sudo apt-get install -y wget unzip curl jq

                # 3. Get Stable Chrome + ChromeDriver from CFT JSON
                CFT_URL="https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"
                CFT_JSON=$(curl -s "$CFT_URL")

                STABLE_JSON=$(echo "$CFT_JSON" | jq -r '.channels.Stable')
                CHROME_VERSION=$(echo "$STABLE_JSON" | jq -r '.version')
                CHROME_URL=$(echo "$STABLE_JSON" \
                  | jq -r '.downloads.chrome[] | select(.platform=="linux64") | .url')
                CHROMEDRIVER_URL=$(echo "$STABLE_JSON" \
                  | jq -r '.downloads.chromedriver[] | select(.platform=="linux64") | .url')

                echo "Stable Chrome version: $CHROME_VERSION"
                echo "Chrome URL: $CHROME_URL"
                echo "ChromeDriver URL: $CHROMEDRIVER_URL"

                # 4. Install that Chrome into /opt/google/chrome and expose as google-chrome
                wget -q -O /tmp/chrome-linux64.zip "$CHROME_URL"
                unzip -q /tmp/chrome-linux64.zip -d /tmp/chrome-linux64

                # Clean any previous custom Chrome dir
                sudo rm -rf /opt/google/chrome
                sudo mkdir -p /opt/google/chrome

                # Copy extracted files
                sudo cp -r /tmp/chrome-linux64/* /opt/google/chrome/

                # Create/refresh symlink so "google-chrome" works
                sudo ln -sf /opt/google/chrome/chrome /usr/bin/google-chrome

                # 5. Install matching ChromeDriver
                wget -q -O /tmp/chromedriver-linux64.zip "$CHROMEDRIVER_URL"
                unzip -q /tmp/chromedriver-linux64.zip -d /tmp/
                sudo mv /tmp/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
                sudo chmod +x /usr/local/bin/chromedriver

                # 6. Cleanup
                rm -rf /tmp/chrome-linux64 /tmp/chrome-linux64.zip
                rm -rf /tmp/chromedriver-linux64 /tmp/chromedriver-linux64.zip

                # 7. Sanity check
                echo "PATH: $PATH"
                which google-chrome || echo "google-chrome not on PATH"
                which chromedriver || echo "chromedriver not on PATH"
                google-chrome --version || echo "chrome not runnable"
                chromedriver --version || echo "chromedriver not runnable"

            - name: Run the automation with Xvfb
              run: |
                Xvfb :99 -screen 0 1920x1080x24 &
                export DISPLAY=:99
                python run_bots.py --bot "${{ github.event.inputs.bot}}"
              env:
                DISPLAY: :99
                BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
                CHAT_ID: ${{ secrets.CHAT_ID }}
                PAT: ${{ secrets.PAT }}
                MAILSAC_API: ${{ secrets.MAILSAC_API }}
                CAPTCHA_API: ${{ secrets.CAPTCHA_API }}
