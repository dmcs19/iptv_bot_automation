name: Update IPTV playlists

on:
    #schedule:
    #    - cron: "0 0 * * *"
    workflow_dispatch: # Optional manual trigger
      inputs:
            bot:
                description: "Select which bot to run"
                required: false
                type: choice
                default: "LuxIPTV"  # Default bot for scheduled runs
                options:
                    - LayerSeven
                    - LuxIPTV
                    - TereaTv
                    - IPTVDoor
                    - All

jobs:
    run-bot-process:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Remove preinstalled Chrome
              run: |
                sudo apt-get purge google-chrome-stable -y
                sudo rm -rf /opt/google/chrome
                sudo rm -rf ~/.config/google-chrome
                sudo rm -rf ~/.cache/google-chrome

            - name: Install Chrome and matching ChromeDriver
              run: |
                set -e

                # Clean any existing Chrome
                sudo apt-get purge -y google-chrome-stable || true
                sudo rm -rf /opt/google/chrome ~/.config/google-chrome ~/.cache/google-chrome

                # Dependencies
                sudo apt-get update
                sudo apt-get install -y wget unzip curl jq

                # Install Chrome stable
                wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
                sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y

                # Get Chrome versions
                CHROME_FULL_VERSION=$(google-chrome --version | awk '{print $3}')
                CHROME_MAJOR_VERSION=$(echo "$CHROME_FULL_VERSION" | cut -d '.' -f 1)
                echo "Chrome full version: $CHROME_FULL_VERSION"
                echo "Chrome major version: $CHROME_MAJOR_VERSION"

                # Use Chrome for Testing “latest patch per build” JSON
                LATEST_JSON_URL="https://googlechromelabs.github.io/chrome-for-testing/latest-patch-versions-per-build.json"
                JSON=$(curl -s "$LATEST_JSON_URL")

                # Resolve exact Chrome for Testing version for this milestone (stable, linux)
                CHROMEDRIVER_VERSION=$(echo "$JSON" \
                  | jq -r --arg maj "$CHROME_MAJOR_VERSION" '
                      .builds[]
                      | select(.milestone == ($maj|tonumber))
                      | .version
                    ' | head -n 1)

                if [ -z "$CHROMEDRIVER_VERSION" ] || [ "$CHROMEDRIVER_VERSION" = "null" ]; then
                  echo "Failed to resolve ChromeDriver version for milestone $CHROME_MAJOR_VERSION"
                  exit 1
                fi

                echo "Resolved ChromeDriver version: $CHROMEDRIVER_VERSION"

                # Download and install ChromeDriver
                CHROMEDRIVER_URL="https://storage.googleapis.com/chrome-for-testing-public/${CHROMEDRIVER_VERSION}/linux64/chromedriver-linux64.zip"
                wget -q -O /tmp/chromedriver-linux64.zip "$CHROMEDRIVER_URL"
                unzip -q /tmp/chromedriver-linux64.zip -d /tmp/
                sudo mv /tmp/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
                sudo chmod +x /usr/local/bin/chromedriver

                # Cleanup
                rm -f google-chrome-stable_current_amd64.deb
                rm -rf /tmp/chromedriver-linux64 /tmp/chromedriver-linux64.zip

                # Sanity checks
                google-chrome --version
                chromedriver --version



            - name: Run the automation with Xvfb
              run: |
                Xvfb :99 -screen 0 1920x1080x24 &
                export DISPLAY=:99
                python run_bots.py --bot "${{ github.event.inputs.bot}}"
              env:
                DISPLAY: :99
                BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
                CHAT_ID: ${{ secrets.CHAT_ID }}
                PAT: ${{ secrets.PAT }}
                MAILSAC_API: ${{ secrets.MAILSAC_API }}
                CAPTCHA_API: ${{ secrets.CAPTCHA_API }}
