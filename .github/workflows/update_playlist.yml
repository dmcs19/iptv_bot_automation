name: Update IPTV playlists

on:
    #schedule:
    #    - cron: "0 0 * * *"
    workflow_dispatch: # Optional manual trigger
      inputs:
            bot:
                description: "Select which bot to run"
                required: false
                type: choice
                default: "LuxIPTV"  # Default bot for scheduled runs
                options:
                    - LayerSeven
                    - LuxIPTV
                    - TereaTv
                    - IPTVDoor
                    - All

jobs:
    run-bot-process:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.10"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Remove preinstalled Chrome
              run: |
                sudo apt-get purge google-chrome-stable -y
                sudo rm -rf /opt/google/chrome
                sudo rm -rf ~/.config/google-chrome
                sudo rm -rf ~/.cache/google-chrome

            - name: Install Chrome and matching ChromeDriver
              run: |
                # Add Google Chrome repo
                wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
                echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
                sudo apt-get update
                
                # Install Chrome
                sudo apt-get install -y google-chrome-stable
                
                # Get Chrome version and install matching ChromeDriver
                CHROME_MAJOR=$(google-chrome --version | sed -E 's/Google Chrome ([0-9]+)(?:\.[0-9.]+).*/\1/')
                echo "Chrome major version: $CHROME_MAJOR"
                
                # Download matching ChromeDriver
                wget -N "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_MAJOR}.0.0.0/linux64/chromedriver-linux64.zip" -P ~/
                unzip ~/chromedriver-linux64.zip -d ~/chromedriver/
                sudo mv ~/chromedriver/chromedriver-linux64/chromedriver /usr/local/bin/
                sudo chmod +x /usr/local/bin/chromedriver
                rm -rf ~/chromedriver-linux64.zip ~/chromedriver

            - name: Run the automation with Xvfb
              run: |
                Xvfb :99 -screen 0 1920x1080x24 &
                export DISPLAY=:99
                python run_bots.py --bot "${{ github.event.inputs.bot}}"
              env:
                DISPLAY: :99
                BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
                CHAT_ID: ${{ secrets.CHAT_ID }}
                PAT: ${{ secrets.PAT }}
                MAILSAC_API: ${{ secrets.MAILSAC_API }}
                CAPTCHA_API: ${{ secrets.CAPTCHA_API }}
